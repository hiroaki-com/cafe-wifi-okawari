name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 構文検査
        run: |
          zsh -n cafe-wifi-okawari.sh install.sh menubar.sh test/run.sh
          osacompile -o /dev/null -e 'display alert "cafe-wifi-okawari" message "x" giving up after 120'
          osacompile -l JavaScript -o /dev/null menubar.js
      - name: メニューバーの読み込み（アイコンとメニューを1回作って終わる）
        run: osascript -l JavaScript menubar.js --check
      - name: 模擬試験
        run: zsh test/run.sh
